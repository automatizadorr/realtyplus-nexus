name: Clasificar leads con IA (cada 5h)

on:
  schedule:
    # Corre a las 00:00, 05:00, 10:00, 15:00 y 20:00 UTC cada día
    - cron: "0 0,5,10,15,20 * * *"
  # Permite dispararlo manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  classify:
    name: Clasificar y etiquetar leads
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Invocar Edge Function classify-and-notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Iniciando clasificación IA de leads — $(date -u)"

          RESPONSE=$(curl -s -w "\n__STATUS__%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/functions/v1/classify-and-notify" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 120)

          HTTP_CODE=$(echo "$RESPONSE" | grep "__STATUS__" | sed 's/__STATUS__//')
          BODY=$(echo "$RESPONSE" | grep -v "__STATUS__")

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Error HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Clasificación completada"
